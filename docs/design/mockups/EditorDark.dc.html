<style>
body{margin:0}
a{color:#FFF3D6;text-decoration:underline;text-underline-offset:3px;text-decoration-color:#9C8A6A}a:hover{color:#FFFFFF}
.frame{position:relative;border:1px solid #E6D3AC;padding:16px;box-sizing:border-box;background:#120C18}
.frame-in{border:0;box-sizing:border-box;height:100%}
.c{width:8px;height:8px;border:1px solid #E6D3AC;position:absolute;box-sizing:border-box;pointer-events:none}
.c::after,.c::before{content:"";position:absolute;box-sizing:border-box}
.c::after{width:32px;height:15px}
.c::before{width:15px;height:32px}
.c-tl,.c-bl{left:-8px}.c-tl::after,.c-bl::after{left:14px;border-left:1px solid #E6D3AC}.c-tl::before,.c-bl::before{left:-1px;border-left:1px solid #E6D3AC}
.c-tr,.c-br{right:-8px}.c-tr::after,.c-br::after{right:14px;border-right:1px solid #E6D3AC}.c-tr::before,.c-br::before{right:-1px;border-right:1px solid #E6D3AC}
.c-tl,.c-tr{top:-8px}.c-tl::after,.c-tr::after{top:-1px;border-top:1px solid #E6D3AC}.c-tl::before,.c-tr::before{top:14px;border-top:1px solid #E6D3AC}
.c-bl,.c-br{bottom:-8px}.c-bl::after,.c-br::after{bottom:-1px;border-bottom:1px solid #E6D3AC}.c-bl::before,.c-br::before{bottom:14px;border-bottom:1px solid #E6D3AC}
.hex{display:flex;align-items:center;justify-content:center;position:relative;height:32px;padding:0 16px;margin:0 36px;box-sizing:border-box;border-top:1px solid #E6D3AC;border-bottom:1px solid #E6D3AC;text-decoration:none;color:#F2E3C4;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:19px;letter-spacing:0;transition:background 200ms ease-in-out}
.hex .l,.hex .r{position:absolute;top:-1px;width:28px;height:32px;pointer-events:none}
.hex .l svg,.hex .r svg{width:28px;height:32px;display:block;overflow:visible}
.hex .l{left:-28px}.hex .r{right:-28px;transform:scaleX(-1)}
.hex.ghost{color:#F2E3C4}
.hex .bg{fill:transparent;transition:fill 200ms ease-in-out}
.hex:hover,.hex.hover{background:#241A2E}.hex:hover .bg,.hex.hover .bg{fill:#241A2E}
</style>
</helmet>
