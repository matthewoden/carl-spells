<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carl — link preview card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&amp;family=Alegreya:ital,wght@0,400;0,500;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4A2F1C;text-decoration:underline;text-underline-offset:3px;text-decoration-color:#B8A68C}a:hover{color:#2E1F14}
.frame{position:relative;border:1px solid #2E1F14;padding:32px;box-sizing:border-box;background:#F4ECDC}
.frame-in{border:0;box-sizing:border-box;height:100%}
.c{width:16px;height:16px;border:1px solid #2E1F14;position:absolute;box-sizing:border-box;pointer-events:none}
.c::after,.c::before{content:"";position:absolute;box-sizing:border-box}
.c::after{width:64px;height:30px}
.c::before{width:30px;height:64px}
.c-tl,.c-bl{left:-16px}.c-tl::after,.c-bl::after{left:28px;border-left:1px solid #2E1F14}.c-tl::before,.c-bl::before{left:-1px;border-left:1px solid #2E1F14}
.c-tr,.c-br{right:-16px}.c-tr::after,.c-br::after{right:28px;border-right:1px solid #2E1F14}.c-tr::before,.c-br::before{right:-1px;border-right:1px solid #2E1F14}
.c-tl,.c-tr{top:-16px}.c-tl::after,.c-tr::after{top:-1px;border-top:1px solid #2E1F14}.c-tl::before,.c-tr::before{top:28px;border-top:1px solid #2E1F14}
.c-bl,.c-br{bottom:-16px}.c-bl::after,.c-br::after{bottom:-1px;border-bottom:1px solid #2E1F14}.c-bl::before,.c-br::before{bottom:28px;border-bottom:1px solid #2E1F14}
.hex{color:#2E1F14;display:flex;align-items:center;justify-content:center;position:relative;height:32px;padding:0 16px;margin:0 36px;box-sizing:border-box;border-top:1px solid #2E1F14;border-bottom:1px solid #2E1F14;text-decoration:none;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:19px;letter-spacing:0;transition:background 200ms ease-in-out}
.hex .l,.hex .r{position:absolute;top:-1px;width:28px;height:32px;pointer-events:none}
.hex .l svg,.hex .r svg{width:28px;height:32px;display:block;overflow:visible}
.hex .l{left:-28px}.hex .r{right:-28px;transform:scaleX(-1)}
.hex .bg{fill:transparent;transition:fill 200ms ease-in-out}
.hex:hover,.hex.hover{background:#EADFC8}.hex:hover .bg,.hex.hover .bg{fill:#EADFC8}

</style>
</helmet>
<div style="width: 1200px; height: 630px; box-sizing: border-box; background: #F4ECDC; color: #2E1F14; font-family: 'Alegreya', Georgia, serif; padding: 40px">
  <div class="frame" style="width: 100%; height: 100%">
    <span class="c c-tl" aria-hidden="true"></span><span class="c c-tr" aria-hidden="true"></span><span class="c c-bl" aria-hidden="true"></span><span class="c c-br" aria-hidden="true"></span>
    <div class="frame-in" style="width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 80px; position: relative">
      <span style="position: absolute; top: 28px; left: 0; right: 0; font-variant: small-caps; letter-spacing: 0.16em; font-size: 24px; color: #6E543F">Add, change, or remove a letter</span>
      <p style="margin: 0 0 6px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 44px; color: #6E543F; text-decoration: line-through; text-decoration-color: #7A4FA3; text-decoration-thickness: 2px">Fireball</p>
      <h1 style="margin: 0 0 30px; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 700; font-size: 168px; line-height: 0.95; letter-spacing: -0.015em">Fireball<span style="color: #7A4FA3">s</span></h1>
      <div style="display: flex; align-items: center; gap: 18px; margin-bottom: 22px">
        <span style="width: 90px; height: 1px; background: #D5C3A5"></span>
        <span style="color: #7A4FA3; font-size: 30px">❧</span>
        <span style="width: 90px; height: 1px; background: #D5C3A5"></span>
      </div>
      <div style="position: absolute; bottom: 24px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 40px; font-size: 22px; color: #6E543F">
        <span style="font-variant: small-caps; letter-spacing: 0.1em">Level 3 · Evocation</span>
        <span style="font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 700; font-size: 26px; letter-spacing: 0.18em; color: #2E1F14">CARL</span>
        <span style="font-variant: small-caps; letter-spacing: 0.1em">carl-spells.com</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":630}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
